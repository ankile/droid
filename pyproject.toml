[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "droid"
authors = [
    {name = "Alexander Khazatsky "}
]
description = "Distributed Robot Interaction Dataset"
version = "0.0.1"
readme = "README.md"
requires-python = ">=3.7"
keywords = ["robotics"]
dependencies = [
    # Runtime imports of the modules SIR actually uses (robot_env, camera_utils,
    # franka, robot_ik, misc): unpinned so `droid` can be locked INSIDE the SIR uv
    # project (its `robot` extra) instead of being hand-layered with --no-deps.
    # The upstream hard pins (mujoco==2.3.2, opencv==4.6, protobuf==3.20.1, ...)
    # conflict with lerobot/robosuite and live in the `full` extra below.
    "boto3",
    "gym",
    "h5py",
    "imageio",
    "matplotlib",
    "numpy",
    "opencv-python",
    "Pillow",
    "scipy",
    "tqdm",
    "zerorpc",
]

[project.optional-dependencies]
# Upstream droid-dataset/droid pins, kept for standalone (non-SIR) installs.
full = [
    "customtkinter",
    "dm-control==1.0.5",
    "mujoco==2.3.2",
    "open3d",
    "opencv-python==4.6.0.66",
    "opencv-contrib-python==4.6.0.66",
    "protobuf==3.20.1",
    "psutil",
    "pyrallis",
]
dev = [
    "black[jupyter]",
    "ipython",
    "pre-commit",
    "ruff",
]
postprocessing = [
    "scikit-image",
]

[project.urls]
homepage = "https://github.com/droid-dataset/droid"
repository = "https://github.com/droid-dataset/droid"
documentation = "https://github.com/droid-dataset/droid"

[tool.black]
line-length = 121
target-version = ["py37", "py38", "py39", "py310"]
preview = true

[tool.ruff]
line-length = 121
target-version = "py38"
select = ["A", "B", "C90", "E", "F", "I", "RUF", "W"]
ignore = ["F405", "B006", "C901", "F403", "E722"]
[tool.ruff.per-file-ignores]
"__init__.py" = ["E402", "F401"]

[tool.isort]
profile = "black"
line_length = 121
skip = ["__init__.py"]
filter_files = true
py_version = "all"

[tool.setuptools.packages.find]
where = ["."]
include = ["droid*"]
exclude = ["cache"]
